# Engångsjobb: skriver ut klubbfärger från Wikipedia för en lista klubbar (för kontroll)
name: Kolla klubbfärger
on:
  workflow_dispatch:
    inputs:
      titles:
        description: "Sidtitlar, åtskilda med |"
        required: true
      langs:
        description: "Språk"
        default: "sv,en"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-kits.js "${{ github.event.inputs.titles }}"
        env:
          LANGS: ${{ github.event.inputs.langs }}
