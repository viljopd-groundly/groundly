# Engångsjobb: letar klubbfärger på Wikipedia för klubbar som saknar färger (tools/colors_query.json -> tools/colors_found.json)
name: Leta klubbfärger
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/find-colors.js
      - run: |
          git config user.name "groundly-bot"
          git config user.email "groundly-bot@users.noreply.github.com"
          git add tools/colors_found.json
          git diff --cached --quiet || git commit -m "Klubbfärger från Wikipedia (för granskning)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
