# Påminnelser körs numera i det privata repot groundly-backup (där nyckeln FIREBASE_SA finns), varje timme.
# Det här jobbet finns kvar för manuell körning om nyckeln någon gång läggs in här.
name: Påminnelser
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Torrkörning: visa vad som skulle skickas utan att skicka"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          PUSH_DRY: ${{ inputs.dry && '1' || '' }}
        run: node tools/push.js
