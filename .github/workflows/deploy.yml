# Bygger och publicerar Groundly på GitHub Pages.
#  - vid varje push till main (t.ex. när Claude ändrar koden)
#  - varje natt: hämtar nya matcher/resultat (openfootball + API-Football) först
#  - manuellt: Actions → "Bygg och publicera" → Run workflow
name: Bygg och publicera
on:
  push:
    branches: [main]
  schedule:
    - cron: "49 1 * * *"   # 03:49 svensk sommartid, 02:49 vintertid
  workflow_dispatch:
    inputs:
      nightly:
        description: "Kör nattuppdateringen först"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nattuppdatering
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          [ -f site/data/events.json ] && cp site/data/events.json tools/prev_events.json || true
          mkdir -p "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          node "$GITHUB_WORKSPACE/tools/nightly.js" "$GITHUB_WORKSPACE/tools" "$GITHUB_WORKSPACE/site" | tee "$RUNNER_TEMP/summary.json"
          # senaste körningens sammanfattning (utan nyckel) sparas i repot så att den kan läsas i efterhand
          tail -n 1 "$RUNNER_TEMP/summary.json" > "$GITHUB_WORKSPACE/tools/last-run.json"
          echo '### Nattuppdatering' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Spara nya data i repot
        if: github.event_name != 'push'
        run: |
          rm -f tools/prev_events.json
          git config user.name "groundly-bot"
          git config user.email "groundly-bot@users.noreply.github.com"
          git add site/data site/archive tools/last-run.json
          git diff --cached --quiet || git commit -m "Nattuppdatering $(date -u +%F)"
          # någon kan ha pushat under körningen (t.ex. en kodändring) – lägg datan ovanpå
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done

      - name: Bygg sidan
        run: node scripts/build-web.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
