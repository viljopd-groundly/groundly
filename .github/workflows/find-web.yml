# Engångsjobb: letar officiella webbplatser i Wikidata för klubbar/landslag som saknar en (tools/web_query.json)
name: Leta webbplatser
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/find-web.js
      - run: |
          git config user.name "groundly-bot"
          git config user.email "groundly-bot@users.noreply.github.com"
          git add tools/web_found.json
          git diff --cached --quiet || git commit -m "Webbplatser från Wikidata (för granskning)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
