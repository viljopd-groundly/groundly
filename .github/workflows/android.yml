name: Android-app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "src/template.html", "src/i18n/**", "site/js/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Bygg webbappen
        working-directory: .
        run: node scripts/build-web.js
      - name: Capacitor
        run: |
          npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/assets@^3
          node scripts/prepare.js
          [ -d android ] || npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0B1224' --iconBackgroundColorDark '#0B1224' --splashBackgroundColor '#0B1224' --splashBackgroundColorDark '#0B1224' || echo "ikoner: hoppar över"
          npx cap sync android
      - name: Versionsnummer
        run: |
          V=$((GITHUB_RUN_NUMBER+1))
          sed -i -E "s/versionCode [0-9]+/versionCode $V/; s/versionName \"[^\"]+\"/versionName \"0.1.$V\"/" android/app/build.gradle
      - name: Bygg
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Signera (testnyckel)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          $BT/apksigner sign --ks test-signing/test.jks --ks-pass pass:groundly-test --ks-key-alias test --out groundly.apk /tmp/aligned.apk
      - name: Lägg upp testversionen
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete android-test --yes --cleanup-tag 2>/dev/null || true
          gh release create android-test groundly.apk --prerelease --title "Groundly för Android (testversion)" \
            --notes "Testversion byggd $(date -u +%F). Öppna länken till groundly.apk på en Android-telefon och installera (tillåt installation från webbläsaren första gången)."
