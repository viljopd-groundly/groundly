<style>

  --f-body:"Figtree",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --pitch:#5fcf8a; --pitch-soft:#173a26; --chalk:#1a2c22;
  --flood:#f2c14e; --flood-soft:#3a2f12; --two:#9db5e8; --two-soft:#1c2840; --three:#d3a6ea; --three-soft:#2f1f3a; --bad:#ff8a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1611; --surface:#14231b; --fg:#e6efe9; --muted:#93a89b; --line:#26392e;
  --pitch:#5fcf8a; --pitch-soft:#173a26; --chalk:#1a2c22;
  --flood:#f2c14e; --flood-soft:#3a2f12; --two:#9db5e8; --two-soft:#1c2840; --three:#d3a6ea; --three-soft:#2f1f3a; --bad:#ff8a7a; color-scheme:dark}
:root[data-theme="dim"]{
  --bg:#d3ddd6; --surface:#e6ece8; --fg:#10231a; --muted:#475b4f; --line:#b9c8be;

  --flood:#8a6200; --flood-soft:#efe0b4; --two:#334f80; --two-soft:#cfd9ec; --three:#6c4580; --three-soft:#e2d4ea; --bad:#a3342a; color-scheme:light}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.modes{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px}

#tblLeagues{flex-wrap:wrap;overflow:visible;gap:6px}#tblLeagues .chip{flex:none;font-size:13px;padding:6px 11px;min-height:0;white-space:nowrap}
.tblhead{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}.tblwrap{overflow-x:auto;margin:0 -4px}
.ltbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}.ltbl th{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:4px 3px;border-bottom:1px solid var(--line)}
.ltbl td{text-align:center;padding:5px 3px;border-bottom:1px solid var(--line)}.ltbl .tl{text-align:left}.ltbl tr.hl td{background:var(--accent-soft)}.ltbl tr.fav td:nth-child(2){font-weight:700}
.tteam{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}.tteam span{overflow-wrap:anywhere}.tteam .crest{flex:none}.ltbl td.n{width:1%;white-space:nowrap;padding:5px 4px}.tteam:focus-visible{outline:2px solid var(--accent)}
.fm{display:inline-block;width:15px;height:15px;line-height:15px;border-radius:50%;font-size:9px;font-style:normal;font-weight:700;color:#fff;margin:0 1px}.fm.w{background:#1e7a3c}.fm.d{background:#8a9a90}.fm.l{background:#c0392b}
@media (max-width:420px){.ltbl .fcol{display:none}.ltbl{font-size:13px}}
.tblcard+.tblcard{margin-top:12px}.tblcard .chips{margin:4px 0 8px}.ltbl.sq td.tl{white-space:normal}.goals{list-style:none;padding:0;margin:4px 0 8px;display:flex;flex-direction:column;gap:4px;font-size:14px}.gmin{display:inline-block;min-width:38px;color:var(--muted)}.rc{display:inline-block;width:10px;height:13px;background:#c0392b;border-radius:2px;vertical-align:-2px}

#leagueChips{flex-wrap:wrap;overflow:visible;gap:6px}#leagueChips .chip{flex:none;font-size:13px;padding:6px 11px;min-height:0;white-space:nowrap}

.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--fg)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;box-sizing:border-box}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .main{min-width:0}
.crow{display:flex;gap:12px;align-items:center}.ctxt{min-width:0}
.crest{flex:none;border-radius:50%;background:var(--c1);box-shadow:inset 0 0 0 calc(var(--sz,40px)*.1) var(--c2),0 0 0 1px var(--line);display:inline-grid;place-items:center;font-family:var(--f-mono);font-weight:700;letter-spacing:-.02em;line-height:1;user-select:none}
.crest{box-shadow:inset 0 0 0 4px var(--c2),0 0 0 1px var(--line)}
.crest.sm{box-shadow:inset 0 0 0 2px var(--c2),0 0 0 1px var(--line);vertical-align:middle;position:relative;top:-2px;margin-right:6px}
img.crest.flag{object-fit:cover;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
img.crest.logo{object-fit:contain;background:none;box-shadow:none;border-radius:0}
.name{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;margin:0}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.yr{text-align:right;font-family:var(--f-mono)}
.yr b{display:block;font-size:20px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.yr small{font-size:11px;color:var(--muted)}
.pills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

.detail{grid-column:1/-1;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}

let _ac=null;function clubsAt(k){if(!_ac){_ac=new Map();Object.values(C).forEach(o=>{if(!o.s)return;const kk=arenaKey(o.s);if(!_ac.has(kk))_ac.set(kk,[]);_ac.get(kk).push(o);});setTimeout(()=>{_ac=null;},0);}return _ac.get(k)||[];}

  const mx=Math.max(0,...cnt);const ok=i=>cnt[i]>=mx*0.5;

function myClick(t){
  if(t.dataset.stcountry!==undefined){stCountry=t.dataset.stcountry;stLeague="";stOpen=null;renderMine();return;}
  if(t.dataset.stleague!==undefined){stLeague=t.dataset.stleague;stOpen=null;renderMine();return;}
  if(t.dataset.stteam){stOpen=stOpen===t.dataset.stteam?null:t.dataset.stteam;renderMine();return;}
  if(t.dataset.visopen){visOpen=visOpen===t.dataset.visopen?null:t.dataset.visopen;renderMine();return;}
  if(t.dataset.stkind){stKind=t.dataset.stkind;store.set("fk-stkind",stKind);renderMine();return;}
  if(t.dataset.stsort){stSort=t.dataset.stsort;store.set("fk-stsort",stSort);renderMine();return;}
  if(t.dataset.myyear){myYear=t.dataset.myyear;MYMORE.att=3;renderMine();return;}
  if(t.dataset.mysub){mySub=t.dataset.mysub;store.set("fk-mysub",mySub);renderMine();return;}
  if(t.id==="amOpen"){addingMatch=true;fillVenueList();renderMine();setTimeout(()=>document.getElementById("amHome")?.focus(),0);return;}
  if(t.id==="amCancel"){addingMatch=false;renderMine();return;}
  if(t.dataset.wishm){const m=matchById(t.dataset.wishm);if(!m)return;mutate(d=>{d.wishMatches=isWishM(m._id)?d.wishMatches.filter(w=>w.id!==m._id):[...d.wishMatches,slim(m)];});return;}
  if(t.dataset.attend){const m=matchById(t.dataset.attend);if(!m)return;let added=null;mutate(d=>{if(isAtt(m._id))d.attended=d.attended.filter(a=>a.mid!==m._id);else{added=attendFromMatch(m);d.attended=[...d.attended,added];}d.wishMatches=d.wishMatches.filter(w=>w.id!==m._id);});if(added&&!added.score)askScore(added.id);return;}
  if(t.dataset.wmdone){const w=MY.wishMatches.find(x=>x.id===t.dataset.wmdone);if(!w)return;
    mutate(d=>{d.wishMatches=d.wishMatches.filter(x=>x.id!==w.id);if(!d.attended.some(a=>a.mid===w.id))d.attended.push({id:newId(),mid:w.id,home:w.home,away:w.away,homeName:w.homeName,awayName:w.awayName,date:w.kickoff?dayKey(new Date(w.kickoff)):(w.dateFrom||today()),score:null,note:"",venue:w.venue,city:w.city,country:w.country,comp:w.comp});});mySub="been";{const a=MY.attended.find(x=>x.mid===w.id);if(a&&!a.score)askScore(a.id);}return;}
  if(t.dataset.visit){const id=t.dataset.visit;mutate(d=>{if(d.visited[id])delete d.visited[id];else d.visited[id]={date:today()};});return;}
  if(t.dataset.wishc){const id=t.dataset.wishc;mutate(d=>{d.wishClubs=d.wishClubs.includes(id)?d.wishClubs.filter(x=>x!==id):[...d.wishClubs,id];});return;}
  if(t.dataset.mymore){MYMORE[t.dataset.mymore]+=10;renderMine();return;}
  if(t.dataset.myless){const k=t.dataset.myless;MYMORE[k]=3;renderMine();const hd=[...document.querySelectorAll("#mineBody h3.sec, h3.sec")].find(x=>x.textContent.startsWith(k==="att"?"Matcher jag":k==="vis"?"Klubbar och":"Landslag jag"));if(hd)hd.scrollIntoView({block:"start"});return;}
  if(t.dataset.mydel){const k=t.dataset.mydel;if(!myConfirm[k]){myConfirm[k]=1;renderMine();setTimeout(()=>{if(myConfirm[k]){delete myConfirm[k];if(mode==="mine")renderMine();}},4000);return;}
    delete myConfirm[k];const[kind,...rest]=k.split(":");const id=rest.join(":");
    let gone=null;
    mutate(d=>{if(kind==="att"){gone=d.attended.filter(a=>a.id===id);d.attended=d.attended.filter(a=>a.id!==id);}if(kind==="vis"){gone=d.visited[id];delete d.visited[id];}if(kind==="wm"){gone=d.wishMatches.filter(w=>w.id===id);d.wishMatches=d.wishMatches.filter(w=>w.id!==id);}if(kind==="wc"){gone=d.wishClubs.includes(id)?[id]:[];d.wishClubs=d.wishClubs.filter(x=>x!==id);}});
    if(gone&&(!Array.isArray(gone)||gone.length))undoToast(kind==="att"?"Matchen togs bort":kind==="vis"?"Besöket togs bort":"Borttaget från önskelistan",async()=>{
      mutate(d=>{if(kind==="att")d.attended=putBack(d.attended,gone);if(kind==="vis")d.visited[id]=gone;if(kind==="wm")d.wishMatches=putBack(d.wishMatches,gone);if(kind==="wc"&&!d.wishClubs.includes(id))d.wishClubs=[...d.wishClubs,id];});});return;}
}

const LIM={};const lim=(k,base)=>LIM[k]||base;
function limBtns(k,total,base,more,less){const n=lim(k,base);if(total<=base)return"";
  return`<div class="morerow">${n<total?`<button class="btn small" data-limmore="${esc(k)}" data-limbase="${base}">${more||"Visa fler"} (${total-n} till)</button>`:""}${n>base?`<button class="btn small" data-limless="${esc(k)}">${less||"Visa färre"}</button>`:""}</div>`;}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-limmore],[data-limless]");if(!t)return;
  const k=t.dataset.limmore||t.dataset.limless;if(t.dataset.limmore){const b=+t.dataset.limbase||5;LIM[k]=lim(k,b)+Math.max(b,10);}else delete LIM[k];
  if(k.startsWith("leg"))legRender();else if(k.startsWith("com:"))renderReports(true);else render();
  if(t.dataset.limless){const card=document.querySelector(`[data-limhead="${CSS.escape(k)}"]`);if(card)card.scrollIntoView({block:"start"});}});

let myStatsOpen=false;
function myStatsHtml(){const A=MY.attended||[];if(A.length<2)return"";
  const sc=A.map(a=>[a,scoreOf(a)]).filter(x=>x[1]);const n=sc.length;let goals=0,hw=0,dr=0,aw=0,nil=0;let top=null,big=null;

function hopInfo(a,b){const la=GEO[a.city],lb=GEO[b.city];if(!la||!lb)return null;const km=roadKm(la,lb);
  const travel=(km<3?0:km/dSpeed*60)+dMargin;const arrive=Date.parse(a.kickoff)+MATCH_MIN*6e4+travel*6e4;const ko=Date.parse(b.kickoff);
  return{km,travel,arrive,spare:(ko-arrive)/6e4,ok:arrive<=ko};}
function findCombos(){const place=resolvePlace();
  const cand=MATCHES.filter(m=>m.kickoff&&GEO[m.city]&&inDates(m)&&gOkM(m)&&(!tiers.size||tiers.has(tierOf(m)))&&placeDist(m,place)!==null).sort(sortM);
  const pairs=[];for(let i=0;i<cand.length;i++)for(let j=i+1;j<cand.length;j++){if(Date.parse(cand[j].kickoff)-Date.parse(cand[i].kickoff)>SPAN)break;const h=hopInfo(cand[i],cand[j]);if(h&&h.ok)pairs.push([i,j]);}
  const triples=[];pairs.forEach(([i,j])=>pairs.forEach(([j2,k])=>{if(j2===j&&Date.parse(cand[k].kickoff)-Date.parse(cand[i].kickoff)<=SPAN)triples.push([i,j,k]);}));
  const inT=new Set();triples.forEach(([i,j,k])=>{inT.add(i+":"+j);inT.add(j+":"+k);});
  const combos=[...triples,...pairs.filter(([i,j])=>!inT.has(i+":"+j))].map(ix=>ix.map(i=>cand[i]));
  combos.sort((x,y)=>y.length-x.length||Date.parse(x[0].kickoff)-Date.parse(y[0].kickoff));

function leagueArenas(l){const m=new Map();Object.values(C).forEach(c=>{if(c.l===l&&c.v&&c.s&&!m.has(c.s))m.set(c.s,c);});return m;}
function derbyCount(){const fromMatches=MY.attended.filter(a=>derbyOfAtt(a));
  const covered=new Set(TIPS.derbies.filter(d=>fromMatches.some(a=>d[2].includes(a.home)&&d[2].includes(a.away))).map(d=>d[0]));
  return fromMatches.length;}
function doubleDays(){const c={};MY.attended.forEach(a=>{c[a.date]=(c[a.date]||0)+1;});return Object.values(c).filter(n=>n>=2).length;}
function natSeen(){const s=new Set();visitedMap().forEach((_,id)=>{if(C[id]&&isNat(C[id]))s.add(id);});MY.attended.forEach(a=>{[a.home,a.away].forEach(id=>{if(id&&C[id]&&isNat(C[id]))s.add(id);});});return s;}
function countriesSeen(){const s=new Set();visitedMap().forEach((_,id)=>{if(C[id])s.add(C[id].c);});MY.attended.forEach(a=>{if(a.country)s.add(a.country);});return s;}
function visitedPins(){const m=new Map();MY.attended.forEach(a=>{const hc=a.home&&C[a.home];const st=a.venue||(hc&&hc.s);const city=a.city||(hc&&hc.city);const ll=(city&&GEO[city])||(hc&&GEO[hc.city]);if(!st||!ll)return;const k=st.toLowerCase();if(!m.has(k))m.set(k,{s:st,ll,c:a.country||(hc&&hc.c)||"",city:city||"",n:0});m.get(k).n++;});return[...m.values()];}
const inRegion=([la,lo],R)=>lo>=R.lon0&&lo<=R.lon1&&la>=R.lat0&&la<=R.lat1;
const autoRegion=p=>p.length&&p.every(x=>x.c==="Sverige")?"se":!p.length||p.some(x=>inRegion(x.ll,MAPS.eu))?"eu":"world";
const seArenaTotal=()=>new Set(Object.values(C).filter(c=>c.c==="Sverige"&&c.s).map(c=>c.s)).size;
function projPin([la,lo],R){const my=l=>Math.log(Math.tan(Math.PI/4+l*Math.PI/360));const k=R.w/((R.lon1-R.lon0)*Math.PI/180);return[(lo-R.lon0)*Math.PI/180*k,(my(R.lat1)-my(la))*k];}

const CC={BG:"#123d24",FG:"#f3f7f4",AC:"#8fe0ad",MU:"#a9c4b3",LN:"rgba(243,247,244,.14)",LAND:"#21603c",SEA:"#0f3420",PAPER:"#f4efe2",INK:"#13261b",INKM:"#5b6b60"};
const F_D='"Bricolage Grotesque",sans-serif',F_M='"JetBrains Mono",monospace',F_B='"Figtree",sans-serif';
async function fontsReady(){try{await Promise.all([document.fonts.load('800 100px "Bricolage Grotesque"'),document.fonts.load('700 60px "JetBrains Mono"'),document.fonts.load('600 34px "Figtree"')]);}catch(e){}}
function newCanvas(){const W=1080,H=shareFmt==="story"?1920:1350;const cv=document.createElement("canvas");cv.width=W;cv.height=H;return[cv,cv.getContext("2d"),W,H];}
function frame(x,W,H){x.fillStyle=CC.BG;x.fillRect(0,0,W,H);x.strokeStyle=CC.LN;x.lineWidth=4;x.strokeRect(40,40,W-80,H-80);}
function brand(x,W,H){x.fillStyle=CC.AC;x.font=`800 46px ${F_D}`;x.textAlign="left";x.fillText("Groundly",96,H-96);}
function fitText(x,t,weight,fam,max,min,w){let s=max;x.font=`${weight} ${s}px ${fam}`;while(s>min&&x.measureText(t).width>w){s-=2;x.font=`${weight} ${s}px ${fam}`;}
  if(x.measureText(t).width>w){while(t.length>1&&x.measureText(t+"…").width>w)t=t.slice(0,-1);t+="…";}return t;}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function publishCard(id,cv,text,filename){STUDIO[id]={cv,text,filename};const img=document.getElementById("img-"+id);if(img){img.src=cv.toDataURL("image/png");img.className="seasonimg "+shareFmt;}}

function seasonData(){const yr=String(seasonYear);const att=MY.attended.filter(a=>a.date.startsWith(yr)).sort((a,b)=>b.date.localeCompare(a.date));
  const ar=new Set(att.map(a=>a.venue||a.homeName));const ct=new Set(att.map(a=>a.country).filter(Boolean));return{yr,att,ar:ar.size,ct:ct.size};}
function seasonText(){const d=seasonData();return`Min fotbollssäsong ${d.yr}: ${d.att.length} matcher, ${d.ar} arenor, ${d.ct} länder.\n`+d.att.slice(0,10).map(a=>`${fmtDate(a.date)} ${a.homeName} ${a.score||"–"} ${a.awayName}${a.venue?" ("+a.venue+")":""}`).join("\n");}
async function drawSeason(){if(!document.getElementById("img-season"))return;await fontsReady();const[cv,x,W,H]=newCanvas();const d=seasonData();const st=shareFmt==="story";const T=st?260:150;
  frame(x,W,H);const half=st?960:680;x.strokeStyle=CC.LN;x.lineWidth=4;x.beginPath();x.moveTo(40,half);x.lineTo(W-40,half);x.stroke();x.beginPath();x.arc(W-40,half,110,Math.PI/2,Math.PI*1.5);x.stroke();
  x.fillStyle=CC.MU;x.font=`700 30px ${F_M}`;x.fillText("MIN FOTBOLLSSÄSONG",96,T);
  x.fillStyle=CC.FG;x.font=`800 230px ${F_D}`;x.fillText(d.yr,84,T+210);
  [[d.att.length,d.att.length===1?"match":"matcher"],[d.ar,d.ar===1?"arena":"arenor"],[d.ct,d.ct===1?"land":"länder"]].forEach(([n,l],i)=>{const cx=96+i*310;x.fillStyle=CC.AC;x.font=`700 120px ${F_M}`;x.fillText(String(n),cx,T+410);x.fillStyle=CC.MU;x.font=`600 36px ${F_B}`;x.fillText(l,cx+4,T+465);});
  const L=half+80;x.fillStyle=CC.FG;x.font=`800 44px ${F_D}`;x.fillText(d.att.length?"Senaste matcherna":"Inga matcher sparade än",96,L);
  const rows=st?9:6;d.att.slice(0,rows).forEach((a,i)=>{const y=L+70+i*78;x.fillStyle=CC.MU;x.font=`500 28px ${F_M}`;x.font=`500 26px ${F_M}`;x.fillText(fmtDate(a.date),96,y);
    x.fillStyle=CC.FG;const t=fitText(x,`${a.homeName} ${a.score||"–"} ${a.awayName}`,600,F_B,34,30,W-96-300);x.fillText(t,300,y);});
  if(d.att.length>rows){x.fillStyle=CC.MU;x.font=`600 30px ${F_B}`;x.fillText(`+ ${d.att.length-rows} till`,300,L+70+rows*78);}
  brand(x,W,H);publishCard("season",cv,seasonText(),`min-fotbollssasong-${d.yr}.png`);}

// matchkort i biljettstil
function matchFacts(a){const all=MY.attended.slice().sort((p,q)=>p.date.localeCompare(q.date)||p.id.localeCompare(q.id));const n=all.findIndex(z=>z.id===a.id)+1;
  const key=z=>z.venue||z.homeName;const first=all.find(z=>key(z)===key(a));return{n,newArena:first&&first.id===a.id};}
async function drawMatch(a){if(!document.getElementById("img-match"))return;await fontsReady();const[cv,x,W,H]=newCanvas();const st=shareFmt==="story";const f=matchFacts(a);
  frame(x,W,H);const tx=90,tw=W-180,th=st?1380:1020,ty=st?190:110,cut=ty+Math.round(th*0.68);
  x.fillStyle=CC.PAPER;rrect(x,tx,ty,tw,th,36);x.fill();
  x.fillStyle=CC.BG;[tx,tx+tw].forEach(cx=>{x.beginPath();x.arc(cx,cut,34,0,Math.PI*2);x.fill();});
  x.strokeStyle="rgba(19,38,27,.35)";x.lineWidth=4;x.setLineDash([16,14]);x.beginPath();x.moveTo(tx+50,cut);x.lineTo(tx+tw-50,cut);x.stroke();x.setLineDash([]);
  const cx=W/2,inner=tw-120;x.textAlign="left";x.fillStyle=CC.INKM;x.font=`700 30px ${F_M}`;x.fillText("JAG VAR DÄR",tx+60,ty+90);
  if(a.comp){x.textAlign="right";x.fillText(fitText(x,a.comp.toUpperCase(),700,F_M,30,22,inner/2),tx+tw-60,ty+90);}
  x.textAlign="center";x.fillStyle=CC.INK;
  const top=cut-ty;const hy=ty+top*(st?0.30:0.32),sy=ty+top*(st?0.60:0.64),ay=ty+top*(st?0.86:0.90);
  let t=fitText(x,a.homeName,800,F_D,st?104:92,48,inner);x.fillText(t,cx,hy);
  x.font=`700 ${st?230:190}px ${F_M}`;x.fillStyle=CC.BG;x.fillText(a.score||"–",cx,sy);
  x.fillStyle=CC.INK;t=fitText(x,a.awayName,800,F_D,st?104:92,48,inner);x.fillText(t,cx,ay);
  x.textAlign="left";x.fillStyle=CC.INK;const sx=tx+70;
  t=fitText(x,[a.venue,a.city].filter(Boolean).join(", ")||"Arena okänd",700,F_B,44,30,tw-140);x.fillText(t,sx,cut+95);
  x.fillStyle=CC.INKM;x.font=`500 34px ${F_B}`;x.fillText(new Date(a.date+"T12:00:00").toLocaleDateString("sv-SE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),sx,cut+150);
  x.font=`700 30px ${F_M}`;x.fillText(`MATCH NR ${f.n}`,sx,cut+(st?260:225));
  if(f.newArena){x.save();x.translate(tx+tw-190,cut+(st?230:200));x.rotate(-0.12);x.strokeStyle=CC.BG;x.lineWidth=6;rrect(x,-130,-48,260,96,14);x.stroke();x.fillStyle=CC.BG;x.font=`800 40px ${F_D}`;x.textAlign="center";x.fillText("NY ARENA",0,14);x.restore();}
  brand(x,W,H);
  publishCard("match",cv,`Jag var på ${a.homeName} ${a.score||"–"} ${a.awayName}${a.venue?" på "+a.venue:""}, ${a.date}. Match nr ${f.n}${f.newArena?" och en ny arena":""}!`,`match-${a.date}.png`);}

async function drawMap(){if(!document.getElementById("img-map"))return;await fontsReady();await loadMaps();if(!MAPS.eu.path)return;const[cv,x,W,H]=newCanvas();const st=shareFmt==="story";
  const allPins=visitedPins();const reg=mapRegion||autoRegion(allPins);const R=MAPS[reg];const ct=countriesSeen().size;const isSe=reg==="se";const pins=isSe?allPins.filter(p=>p.c==="Sverige"):allPins;
  frame(x,W,H);const T=st?220:150;
  x.fillStyle=CC.MU;x.font=`700 30px ${F_M}`;x.fillText(isSe?"MINA ARENOR I SVERIGE":reg==="eu"?"MINA ARENOR I EUROPA":"MINA ARENOR I VÄRLDEN",96,T);
  x.fillStyle=CC.AC;x.font=`700 150px ${F_M}`;const nTxt=String(pins.length);x.fillText(nTxt,90,T+160);const nw=x.measureText(nTxt).width;
  x.fillStyle=CC.FG;x.font=`800 50px ${F_D}`;x.fillText(pins.length===1?"arena":"arenor",110+nw,T+100);x.fillStyle=CC.MU;x.font=`600 34px ${F_B}`;x.fillText(isSe?`av ${seArenaTotal()} svenska i appen`:`${ct} ${ct===1?"land":"länder"}`,112+nw,T+150);
  const bx=70,by=T+210,bw=W-140,bh=H-by-(st?230:190);
  x.save();rrect(x,bx,by,bw,bh,24);x.clip();x.fillStyle=CC.SEA;x.fillRect(bx,by,bw,bh);
  const sc=Math.min(bw/R.w,bh/R.h);
  const ox=bx+(bw-R.w*sc)/2,oy=by+(bh-R.h*sc)/2;
  x.save();x.translate(ox,oy);x.scale(sc,sc);if(R.path2){x.globalAlpha=.4;x.fillStyle=CC.LAND;x.fill(new Path2D(R.path2));x.globalAlpha=1;}x.fillStyle=CC.LAND;x.fill(new Path2D(R.path));x.restore();
  let outside=isSe?allPins.length-pins.length:0;pins.forEach(p=>{if(!inRegion(p.ll,R)){outside++;return;}const[px,py]=projPin(p.ll,R);const X=ox+px*sc,Y=oy+py*sc;
    x.fillStyle=CC.BG;x.beginPath();x.arc(X,Y,16,0,Math.PI*2);x.fill();x.fillStyle=CC.AC;x.beginPath();x.arc(X,Y,11,0,Math.PI*2);x.fill();});
  x.restore();
  if(!pins.length){x.fillStyle=CC.FG;x.font=`600 36px ${F_B}`;x.textAlign="center";x.fillText("Logga matcher du varit på så fylls kartan på",W/2,by+bh/2);x.textAlign="left";}
  if(outside){x.fillStyle=CC.MU;x.font=`600 30px ${F_B}`;x.textAlign="right";x.fillText(isSe?`+ ${outside} utanför Sverige`:`+ ${outside} utanför kartan`,bx+bw,by+bh+50);x.textAlign="left";}
  brand(x,W,H);
  publishCard("map",cv,(isSe?`Mina arenor i Sverige: ${pins.length} av ${seArenaTotal()}.\n`:`Mina arenor: ${pins.length} arenor i ${ct} länder.\n`)+pins.map(p=>p.s).join(", "),`mina-arenor.png`);}

  h+=`<h3 class="sec">Arenor per serie</h3><p class="hint">Som "The 92" i England: besök alla arenor i en serie. Arenor som delas av flera klubbar räknas en gång.</p>
   <details class="arsel"${arSelOpen?" open":""}><summary>Välj serier (${sel.length} valda)</summary>
   ${(()=>{const dr=arDraft||sel;return[...new Set(allL.map(x=>x.c))].map(cn=>`<div class="lbl">${esc(cn)}</div><div class="chips wrapchips">${allL.filter(x=>x.c===cn).map(x=>`<button class="chip" data-arsel="${esc(x.l)}" aria-pressed="${dr.includes(x.l)}">${esc(x.l)}</button>`).join("")}</div>`).join("");})()}

// fyll i resultat som saknas i loggen när resultatet finns i arkivet eller i matchschemat (t.ex. matcher sparade före avspark)
let fillBusy=false,fillDone=false;
async function fillScores(){if(fillBusy||fillDone||myState!=="ready"||!Array.isArray(MY.attended))return;const miss=MY.attended.filter(a=>!a.score&&a.date&&a.date<today());if(!miss.length){fillDone=true;return;}
  fillBusy=true;const nm=x=>norm(String(x||""));const up={};
  try{
    // 1) arkivet (mid = arc:kod:säsong:i). Indexet kan ha ändrats när säsongen hämtats om, så vi matchar på datum och lag
    const files=[...new Set(miss.filter(a=>/^arc:/.test(a.mid||"")).map(a=>a.mid.split(":").slice(1,3).join("/")))];
    for(const k of files){let d;try{d=await arcLoad(`archive/${k}.json?r=${today()}`);}catch(e){continue;}
      miss.filter(a=>(a.mid||"").startsWith("arc:"+k.replace("/",":")+":")).forEach(a=>{const r=d.m.find(m=>m[2]===a.date&&m[4]!=null&&(()=>{const H=d.t[m[0]],A=d.t[m[1]];const hit=(t,id,n)=>(id&&t[1]===id)||nm(t[0])===nm(n)||(t[1]&&C[t[1]]&&nm(C[t[1]].n)===nm(n));return hit(H,a.home,a.homeName)&&hit(A,a.away,a.awayName);})());
        if(r)up[a.id]=`${r[4]}–${r[5]}`;});}
    // 2) matchschemat
    if(typeof MATCHES!=="undefined")miss.filter(a=>!up[a.id]).forEach(a=>{const m=MATCHES.find(x=>x.score&&((a.mid&&x._id===a.mid)||(x.home===a.home&&x.away===a.away&&a.home&&(x.kickoff?dayKey(new Date(x.kickoff)):x.dateFrom)===a.date)));if(m){const sc=scoreOf(m);if(sc)up[a.id]=`${sc[0]}–${sc[1]}`;}});
  }finally{fillBusy=false;}
  const n=Object.keys(up).length;fillDone=true;if(!n)return;
  mutate(d=>{d.attended.forEach(a=>{if(!a.score&&up[a.id])a.score=up[a.id];});});toast(`${n} ${n===1?"resultat":"resultat"} fylldes i automatiskt i din logg`,"check");}

const CULTSET=new Set(TIPS.cult.map(x=>x[0]));
// arenastorlek: liten <5 000, mindre 5 000–9 999, mellanstor 10 000–19 999, stor 20 000+
const sizeClass=x=>!x?null:x<5000?"liten":x<10000?"mindre":x<20000?"mellanstor":"stor";
const SIZE_LBL={liten:"Liten arena",mindre:"Mindre arena",mellanstor:"Mellanstor arena",stor:"Stor arena"};
function similarClubs(c){const k=arenaKey(c.s);const co={};
  if(k)Object.values(RATINGS).forEach(d=>{const r=d&&d.r;if(!r||!r[k])return;Object.keys(r).forEach(k2=>{if(k2!==k)co[k2]=(co[k2]||0)+1;});});
  const rivals=new Set();TIPS.derbies.forEach(d=>{if(d[2].includes(c.id))d[2].forEach(x=>rivals.add(x));});
  const scored=Object.values(C).filter(o=>o.id!==c.id&&!isNat(o)&&!!isW(o)===!!isW(c)&&o.s!==c.s&&!rivals.has(o.id)).map(o=>{let s=0;const why=[];
    if(CULTSET.has(c.id)&&CULTSET.has(o.id)){s+=5;why.push("Också en kultklubb");}
    const n=co[arenaKey(o.s)]||0;if(n){s+=2+n;why.push(`${n} ${n===1?"besökare":"besökare"} har betygsatt båda arenorna`);}
    if(o.l&&o.l===c.l){s+=1.5;why.push("Samma serie");}else if(o.t&&o.t===c.t&&o.c===c.c){s+=0.7;why.push("Samma nivå i "+o.c);}
    const sz=sizeClass(c.cap);if(sz&&sz===sizeClass(o.cap)){s+=1;why.push("Båda har "+SIZE_LBL[sz].toLowerCase());}
    if(c.f&&o.f&&c.f<1905&&o.f<1905){s+=0.5;why.push("Anrik klubb från 1800-talet");}
    if(c.h&&o.h&&c.h.length===0&&o.h.length===0&&c.t>=2&&o.t>=2){s+=0.5;why.push("Underdog utan stora titlar");}
    return{o,s,why};}).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s||a.o.n.localeCompare(b.o.n,"sv"));
  const out=[],perL={};for(const x of scored){const l=x.o.l||"?";if((perL[l]||0)>=2)continue;perL[l]=(perL[l]||0)+1;out.push(x);if(out.length>=4)break;}return out;}
function similarRow(c){if(isNat(c))return"";const list=similarClubs(c);if(!list.length)return"";
  return`<dt>Liknande klubbar</dt><dd><div class="sims">${list.map(({o,why})=>`<button class="simbtn" data-open="${esc(o.id)}"><b>${esc(o.n)}</b><small>${esc(why.slice(0,2).join(" · "))}</small></button>`).join("")}</div></dd>`;}

function arenaDossier(c){const k=arenaKey(c.s);const a=arenaAgg(c.s),t=travelAgg(c.s);
  const pubs=pubList(c).slice(0,8).map(p=>({namn:p.name,publik:p.crowd?CROWD[p.crowd]:null,promenad_min:p.walk||null,tips:p.text||null,gillas_av:p.votes,redaktionens_tips:!!p.ed}));
  const posts=forumState==="ready"?allPosts():[];const threads=posts.filter(p=>!p.parent&&p.club===c.id).slice(0,8).map(th=>({kategori:KIND_L[th.kind]||th.kind,rubrik:String(th.title||"").slice(0,120),text:String(th.body||"").slice(0,300),svar:posts.filter(r=>r.parent===th.key).slice(0,4).map(r=>String(r.body||"").slice(0,200))}));
  const acc={};ACC.forEach(([kk,l])=>{const x=a.acc[kk];if(x.y||x.n)acc[l]={ja:x.y,nej:x.n};});
  const betyg={};RCATS.forEach(([kk,l])=>{if(a.avg[kk]!=null)betyg[l]=+a.avg[kk].toFixed(1);});
  const resa={stationer:t.st,promenad_min:t.walks,lokaltrafik_i_biljetten:t.yn.kombi||null,extratrafik:t.yn.extra||null};
  const bilj={var_man_koper:uniq(t.where).slice(0,3),priser:uniq(t.price).slice(0,4),bortasektion:uniq(t.away).slice(0,2),medlemskap_kravs:t.yn.member||null};
  const has=a.n>0||t.n>0||pubs.length>0||threads.length>0;
  return{has,data:{klubb:c.n,arena:c.s,stad:c.city,land:c.c,kapacitet:c.cap||null,serie:c.l||null,antal_betyg:a.n,betyg_1_till_5:betyg,tillganglighet:acc,resa,biljetter:bilj,pubar:pubs,forumtradar:threads}};}

async function runSummary(id){const c=C[id];if(!c||!sampleFn)return;const d=arenaDossier(c);

  SUM[id]={state:"busy",text:"",err:""};renderClubs();
  const prompt=`Sammanfatta vad besökare har rapporterat om arenan ${c.s} (${c.n}, ${c.city}, ${c.c}) för någon som planerar ett besök.
Skriv på svenska: 3–6 korta punkter som var och en börjar med "- ". Täck det som finns av stämning, mat och dryck, tillgänglighet, resa dit, biljetter och pubar före match.
Ta bara med det som står i underlaget och hitta inte på något. Säg tydligt när en uppgift bygger på få besökare. Avsluta med en punkt om vad underlaget saknar.
Underlag (JSON):
${JSON.stringify(d.data).slice(0,12000)}`;
  try{const r=await sampleFn(prompt,{modelTier:"quick",onText:({text})=>{SUM[id].text=text;const el=document.getElementById("sum-"+id);if(el)el.innerHTML=sumHtml(text);}});SUM[id]={state:"done",text:r.text,err:r.truncated?"Sammanfattningen blev avkortad.":""};}
  catch(e){const code=e&&e.code;SUM[id]={state:"done",text:e&&e.text||"",err:code==="cancelled"?"":code==="not_granted"||code==="sampling_disabled"?"Claude får inte användas här.":code==="rate_limited"?"För många frågor just nu. Försök igen om en stund.":"Sammanfattningen misslyckades. Försök igen."};}
  renderClubs();}

function resolveCity(q){const nq=norm(q||"");if(!nq)return null;const a=CITY_ALIAS[nq];if(a&&GEO[a])return[a,GEO[a]];if(GEO_N[nq])return GEO_N[nq];const hit=Object.keys(GEO_N).find(k=>k.startsWith(nq)||nq.startsWith(k));return hit?GEO_N[hit]:null;}

function mInfo(m,near){return{id:m._id,datum:m.kickoff?matchDate(m):`ej spikat, mellan ${m.dateFrom} och ${m.dateTo}`,tid_svensk_tid:m.kickoff?timeOf(m.kickoff):null,hemmalag:m.homeName,bortalag:m.awayName,hemmalag_id:m.home,turnering:m.comp,arena:m.venue,stad:m.city,land:m.country,km_fran_orten:near&&GEO[m.city]?Math.round(haversine(near[1],GEO[m.city])):undefined};}
function planCands(inp,needKick){const from=isoDate(inp.from)||today(),to=isoDate(inp.to)||addDays(from,13);let near=null,rad=+inp.radius_km||0;
  if(inp.near){near=resolveCity(inp.near);if(!near)throw new Error(`Okänd ort "${inp.near}". Prova en större stad i närheten.`);if(!rad)rad=60;}
  const co=inp.country?norm(inp.country):null,comp=inp.competition?norm(inp.competition):null;
  const list=MATCHES.filter(m=>{if(needKick&&!m.kickoff)return false;const d=m.kickoff?matchDate(m):null;if(d?(d<from||d>to):(m.dateTo<from||m.dateFrom>to))return false;
    if(co&&norm(m.country)!==co)return false;if(comp&&!norm(m.comp).includes(comp))return false;if(near){const ll=GEO[m.city];if(!ll||roadKm(near[1],ll)>rad)return false;}return true;}).sort(sortM);
  return{list,near,from,to};}

function planIntro(){return`Du är reseplaneraren i appen Groundly. Dagens datum: ${today()}. Användarens hemort: ${homeTown||"okänd"}. Användarens favoritlag: ${favList().length?favList().map(id=>C[id].n+" (id "+id+")").join(", "):"inget valt"}.
Appens matchschema täcker Premier League, La Liga, Serie A, Bundesliga, Ligue 1, MLS, några Champions League-omgångar, Allsvenskan och Superettan (Superettans datum är inte spikade). Schemat slutar ${schedEnd()||"snart"}.
Regler:
- Använd verktygen. Hitta aldrig på matcher, tider, pubar, priser eller hotell. Matcher och klubbar i planen måste komma från verktygen, med sina id.
- Ligger önskade datum utanför schemat: säg det tydligt i "missing" och föreslå i stället klubbar och arenor att besöka.
- Hotell bokas via appens knapp vid matchen, så skriv bara "Övernattning i X" utan hotellnamn.
- Restider får vara ungefärliga och ska då sägas vara ungefärliga.
Svara till sist ENDAST med JSON, inget annat:
{"title":"kort rubrik","summary":"1–2 meningar","days":[{"date":"YYYY-MM-DD","label":"t.ex. Lördag 24 oktober","items":[{"time":"HH:MM eller tom sträng","kind":"match|pub|travel|hotel|other","text":"kort beskrivning","match_id":"id eller null","club_id":"id eller null"}]}],"notes":["praktiska tips"],"missing":"vad som inte gick att uppfylla, eller tom sträng"}
Skriv på svenska med korta meningar.`;}
async function runPlan(){const q=planDraft.trim();if(!q){planErr="Skriv vad du vill göra.";renderMatches();return;}
  if(!sampleFn){planErr="Claude är inte tillgängligt i den här vyn.";renderMatches();return;}
  planBusy=true;planErr="";planLog=[];PLAN=null;planCtl=new AbortController();renderMatches();
  try{const d=await sampleFn.json([{role:"user",content:planIntro()+"\n\nAnvändarens önskemål:\n"+q.slice(0,600)}],{tools:PLAN_TOOLS,signal:planCtl.signal,modelTier:"default"});
    if(!d||!Array.isArray(d.days))throw{code:"invalid_json"};PLAN=d;store.set("fk-plan",JSON.stringify({q,plan:d}));}
  catch(e){const c=e&&e.code;planErr=c==="cancelled"?"":c==="not_granted"||c==="sampling_disabled"?"Claude får inte användas här.":c==="tools_unavailable"?"Den här vyn kan inte köra reseplaneraren.":c==="rate_limited"?"För många frågor just nu. Försök igen om en stund.":c==="invalid_json"?"Claude svarade i fel format. Försök igen.":"Planeringen misslyckades. Försök igen.";}
  finally{planBusy=false;planCtl=null;renderMatches();}}

const isSmartBtn=t=>t.dataset.planex!==undefined||t.dataset.planstop||t.dataset.planclear||t.dataset.sumgo||t.dataset.sumclose;
function smartClick(t){
  if(t.dataset.planex!==undefined){planDraft=PLAN_EX[+t.dataset.planex]||"";const ta=document.getElementById("planIn");if(ta){ta.value=planDraft;ta.focus();}return;}

function upIndex(){const now=Date.now()-2*36e5;const day=today();
  if(UPIDX&&UPIDX.m===MATCHES&&UPIDX.day===day&&now-UPIDX.at<36e5)return UPIDX;
  const byKey=new Map(),byHome=new Map(),allHome=new Map();const push=(mp,k,m)=>{let a=mp.get(k);if(!a)mp.set(k,a=[]);a.push(m);};
  for(const m of MATCHES){if(!(m.kickoff?Date.parse(m.kickoff)>now:m.dateTo>=day))continue;push(allHome,m.home,m);if(m.venue)push(byKey,arenaKey(m.venue),m);else push(byHome,m.home,m);}

async function shrinkImage(file){let src=null,url=null;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){src=null;}
  if(!src){url=URL.createObjectURL(file);try{src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});}catch(e){src=null;}}
  try{if(!src)return null;const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;if(!w||!h)return null;const s=Math.min(1,1600/Math.max(w,h));
    const cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b),"image/jpeg",0.82));}
  finally{if(url)URL.revokeObjectURL(url);}}

      const r=await assetsNs.upload(blob,{type});if(repDraft===d&&PHID.test(r.id)){d.photos.push(r.id);d.added.push(r.id);}else await dropAssets([r.id]);}

// ---------- render ----------
function render(){
  const SUB={tabell:"Serietabeller räknade från matchresultaten i appen",hem:"Veckans match, topplistor och det senaste från andra som reser på fotboll",quiz:"Testa dina kunskaper om klubbar, landslag, arenor och derbyn",landslag:"Världens 211 landslag med flagga och hemmaarena, plus Europas U21-lag och kommande mästerskap",arenor:"Arenor med kapacitet, betyg, tillgänglighet och nästa match",klubbar:`${CLUBS.length} klubbar · grundår, arena, kapacitet och meriter`,matcher:"Matcher per ort, datum och avstånd · tider i din tidszon",tips:"Derbyn värda resan och klubbar med en egen kultur",forum:"Frågor och tips från andra som reser på fotboll",reportage:"Berättelser och bilder från andras fotbollsresor",mine:"Matcher du varit på och klubbar du vill besöka"};
  document.getElementById("sub").textContent=SUB[mode];
  {const TT={hem:"",tabell:"Tabeller",klubbar:"Klubbar",landslag:"Landslag",arenor:"Arenor",matcher:"Matcher",tips:"Tips",quiz:"Quiz",reportage:"Reportage",forum:"Forum",mine:"Min fotboll"};const tt=document.getElementById("tbTitle");if(tt)tt.textContent=TT[mode]||"";
   const intro=document.getElementById("intro");if(intro)intro.hidden=mode!=="hem";}
  document.getElementById("foot").innerHTML=mode==="klubbar"
   ?`<div>Serie anges för säsongen 2026/27 där den är kontrollerad mot aktuella spelscheman; övriga visas som senast kända.</div>${AI_ON?`<div>Klubbar utanför listan slås upp av Claude och kan innehålla fel.</div>`:""}<div>Flaggor från flag-icons av Panayiotis Lipiridis (MIT-licens).</div>`
   :mode==="matcher"?`<div>Matcher, tider och resultat hämtas varje natt från API-Football och openfootball (CC0)${FX_UPDATED?`, senast ${esc(fmtDate(FX_UPDATED.slice(0,10)))}`:""}. Avsparkstider kan flyttas, så kontrollera med klubben innan du reser.</div><div>Avstånd räknas fågelvägen mellan orterna.</div>`
   :mode==="tabell"?`<div>Officiella tabeller och spelarstatistik hämtas varje natt från API-Football. Saknas en officiell tabell räknas den fram ur resultaten i appen och märks som uträknad; då ingår inte poängavdrag eller särskilda regler.</div>`
   :mode==="quiz"?`<div>Frågorna skapas från appens klubb- och arenadata.</div>`
   :mode==="landslag"?`<div>Grundår avser förbundet. Flaggor från flag-icons av Panayiotis Lipiridis (MIT-licens).</div>`
   :mode==="arenor"?`<div>Kapacitet enligt klubbdatan. Betyg och tillgänglighet kommer från besökare. Arenor som delas av flera klubbar visas en gång.</div>`
   :mode==="tips"?`<div>Urvalet och beskrivningarna är redaktionella tips. Nästa möte hämtas från det inlagda matchschemat.</div>`
   :mode==="hem"?`<div>Topplistorna visar bara antal, och bara för dem som valt att synas. Veckans match väljs bland derbyn, dina favoritlag och matcher andra peppar.</div>`
   :mode==="reportage"?`<div>Reportagen och bilderna syns för alla som kan öppna sidan. Var och en kan bara ändra och ta bort sina egna; sidans ägare kan dölja reportage. Lägg inte upp bilder på andra personer utan att de vet om det.</div>`
   :mode==="mine"?`<div>Matcherna och listorna här syns bara för dig och följer med ditt claude.ai-konto.</div>`
   :`<div>Inläggen syns för alla som kan öppna sidan. Var och en kan bara ändra och ta bort sina egna inlägg; sidans ägare kan dölja inlägg.</div>`;
  document.getElementById("foot").insertAdjacentHTML("beforeend",`<div><button class="link" data-privacy="1">${ic("shield")} Integritet och villkor</button> · <button class="link" data-feedback="1">${ic("chat")} Tyck till</button></div>`);
  if(mode==="klubbar"||mode==="landslag")renderClubs();else if(mode==="arenor")renderArenas();else if(mode==="matcher")renderMatches();else if(mode==="tabell")renderTable();else if(mode==="tips"||mode==="quiz")rerenderQuizHost();else if(mode==="mine")renderMine();else if(mode==="reportage")renderReports();else if(mode==="hem")renderHome();else renderForum();}
document.body.insertAdjacentHTML("beforeend",`<datalist id="allNats">${Object.values(C).filter(c=>c.l==="Landslag").map(c=>`<option value="${esc(c.n)}">`).join("")}</datalist>`);
document.getElementById("allClubs").innerHTML=Object.values(C).map(c=>`<option value="${esc(c.n)}">`).join("");
setMode(mode);

// ---------- db ----------
(async()=>{let db=null;try{db=await window.claude?.use?.("db")??null;}catch(e){db=null}
  // testkopior kan bära ett eget, inbäddat matchschema
  const FIXED=window.__FIXED_MATCHES;if(Array.isArray(FIXED)){MATCHES=FIXED.map(o=>({...o.data,_id:o.id})).filter(m=>m&&m.homeName&&m.city);dbState=MATCHES.length?"ready":"empty";META={updated:window.__FIXED_UPDATED||null};render();return;}
  if(!db){dbFailed=true;DBM=[];remergeMatches();return;}
  db.collection("matches").onSnapshot(snap=>{DBM=snap.docs.map(d=>({...d.data(),_id:d.id})).filter(m=>m&&m.homeName&&m.city);remergeMatches();},
    ()=>{dbFailed=true;DBM=[];remergeMatches();});
  db.doc("meta/info").onSnapshot(s=>{META=s.exists?s.data():null;render();},()=>{});})();
</script>
