<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Groundly – flytta data</title>
<style>
:root{--bg:#f4f7f4;--surface:#fff;--fg:#14231b;--muted:#5a6b60;--line:#d5ded7;--accent:#1d6b3b;--f-body:system-ui,-apple-system,"Segoe UI",sans-serif;--soft:#e8eee9}
@media (prefers-color-scheme:dark){:root{--bg:#0f1712;--surface:#17221b;--fg:#e6efe8;--muted:#9fb2a5;--line:#2b3a30;--accent:#4fb57a;--soft:#1f2c24}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body)}
main{max-width:560px;margin:0 auto;padding:24px 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
h1{font-size:22px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.btn{font:600 14px var(--f-body);border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
pre{white-space:pre-wrap;font-size:13px;background:var(--soft);padding:10px;border-radius:8px;max-height:300px;overflow:auto}
a{color:var(--accent)}
</style>
<script>
(function(){var ready,p=new Promise(function(r){ready=r});window.__groundlyReady=ready;
setTimeout(function(){ready({use:function(){return Promise.resolve(null)}})},15000);
window.claude={use:function(n){return p.then(function(rt){return rt.use(n)})}};})();
</script>
<script type="module" src="js/runtime.js"></script>
</head>
<body>
<main>
  <div class="topbar"><h1>Flytta data till Groundly</h1><span id="themeBtn"></span></div>
  <div class="card">
    <p>Här läser du in filen <b>groundly-flytt.json</b> med innehåll från den gamla versionen av appen på claude.ai. Allt sparas på kontot du är inloggad med.</p>
    <p id="who">Laddar…</p>
    <input type="file" id="file" accept=".json,application/json" disabled>
    <p><button class="btn primary" id="go" disabled>Flytta</button></p>
    <pre id="log" hidden></pre>
    <p><a href="./">Till appen</a></p>
  </div>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const user = await window.claude.use("user"), db = await window.claude.use("db");
const me = user && await user.id(), admin = me && await user.canEdit();
if (!db) { $("who").textContent = "Firebase är inte inställt än (js/firebase-config.js)."; }
else if (!me) { $("who").innerHTML = `Du är inte inloggad. <button class="btn" data-glogin>Logga in</button>`; }
else {
  $("who").textContent = admin ? "Inloggad som moderator – allt flyttas, även matchschema och moderering." : "Inloggad. Dina egna inlägg och matcher flyttas. (Matchschema och moderering kräver moderator.)";
  $("file").disabled = false;
}
let bundle = null;
$("file").onchange = async e => {
  try { bundle = JSON.parse(await e.target.files[0].text()); if (bundle.groundly !== "flytt") throw 0; $("go").disabled = false; }
  catch (x) { bundle = null; $("go").disabled = true; alert("Filen är inte en Groundly-flyttfil."); }
};
$("go").onclick = async () => {
  $("go").disabled = true; const log = $("log"); log.hidden = false; log.textContent = "";
  const say = t => { log.textContent += t + "\n"; log.scrollTop = 1e9; };
  let ok = 0, skip = 0, bad = 0;
  const adminOnly = /^(matches|meta|mod)\//;
  for (const d of bundle.docs) {
    const path = d.path.split("{me}").join(me);
    if (adminOnly.test(path) && !admin) { skip++; continue; }
    const data = JSON.parse(JSON.stringify(d.data).split("{me}").join(me));
    try { await db.doc(path).set(data); ok++; } catch (x) { bad++; say("Misslyckades: " + path + " (" + (x.code || x.message) + ")"); }
    if ((ok + bad) % 20 === 0) say(`${ok + bad} av ${bundle.docs.length}…`);
  }
  say(`Klart: ${ok} sparade${skip ? `, ${skip} hoppades över (kräver moderator)` : ""}${bad ? `, ${bad} misslyckades` : ""}.`);
  $("go").disabled = false;
};
</script>
</body>
</html>
