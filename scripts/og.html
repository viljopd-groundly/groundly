<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Inter";color:#f6f8f6;
background:radial-gradient(1100px 700px at 85% 120%,#2b8a4f 0%,rgba(43,138,79,0) 60%),#1d6b3b;position:relative}
.pitch{position:absolute;right:-90px;top:50%;transform:translateY(-50%);width:640px;height:420px;border:6px solid rgba(255,255,255,.13);border-radius:28px}
.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:6px solid rgba(255,255,255,.13)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-78px 0 0 -78px;border:6px solid rgba(255,255,255,.13);border-radius:50%}
.wrap{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.logo{display:flex;align-items:center;gap:26px}
h1{font-family:"Inter Display";font-weight:800;font-size:112px;letter-spacing:-.035em;margin:0;line-height:1}
p{font-size:40px;font-weight:600;margin:30px 0 0;color:#f6f8f6;max-width:700px;line-height:1.2}
.chips{display:flex;gap:14px;margin-top:44px}
.chips span{font-size:24px;font-weight:600;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.url{position:absolute;left:84px;bottom:44px;font-size:22px;color:rgba(246,248,246,.7);letter-spacing:.02em}
</style></head><body>
<div class="pitch"></div>
<div class="wrap">
 <div class="logo"><img src="../site/icon-512.png" width="120" height="120" style="border-radius:26px;box-shadow:0 6px 20px rgba(0,0,0,.25)"><h1>Groundly</h1></div>
 <p>Planera och logga dina fotbollsresor</p>
 <div class="chips"><span>Matcher</span><span>Arenor</span><span>Tabeller</span><span>Reportage</span></div>
</div>
<div class="url">viljopd-groundly.github.io/groundly</div>
</body></html>
